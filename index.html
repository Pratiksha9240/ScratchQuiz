<style>
:root{
  --purple:#5E48C4;
  --dark:#4A3AAD;
  --mid:#7B6ED4;
  --pale:#EAE7FE;
  --ghost:#F5F4FF;
  --yellow:#FFD071;
  --black:#1A1A1A;
  --coral:#ED5661;
  --green:#16a34a;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  background:#140e25;
  font-family:Poppins,sans-serif;
  color:var(--black);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
#app{
  width:1280px;height:720px;
  background:white;
  border-radius:20px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  transform-origin:center;
  box-shadow:0 20px 60px #0005;
}
header{
  height:68px;flex:0 0 68px;
  background:var(--purple);
  color:white;
  display:flex;
  align-items:center;

  padding:0 28px;
}
.brand{
  display:flex;
  align-items:center;

}
.logo{
  background:var(--yellow);
  color:var(--black);
  padding:9px 15px;
  border-radius:10px;

}
.lesson-title{
  font-size:18px;
  font-weight:800;
}
.score{
  background:var(--dark);

  font-size:14px;
  font-weight:800;
}
.score strong{color:var(--yellow)}
main{
  flex:1;
  min-height:0;

}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{

}
footer{
  height:67px;flex:0 0 67px;
  border-top:2px solid var(--pale);

  align-items:center;

  padding:0 35px;
}
.nav{
  border:0;
  background:var(--dark);
  color:var(--yellow);
  padding:10px 20px;
  border-radius:10px;
  font-size:13px;
  font-weight:800;
}
.nav:disabled{
  opacity:.35;
  cursor:not-allowed;
}
.progress{
  display:flex;
  gap:4px;
  align-items:center;
}
.dot{
  width:9px;height:9px;
  background:#d9d4ed;
  border-radius:50%;
}
.dot.active{
  background:var(--purple);
  transform:scale(1.25);
}
.dot.done{background:#22c55e}
.center{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.badge{
  background:var(--ghost);
  border:2px solid var(--pale);
  color:var(--purple);
  border-radius:25px;
  padding:8px 17px;
  font-size:12px;
  font-weight:800;
}
h1{
  font-size:42px;
  line-height:1.2;
  margin:18px 0;
  font-weight:800;
}
h1 span{color:var(--purple)}
.intro{
  font-size:15px;
  line-height:1.7;
  color:#555;
  max-width:780px;
  margin:0 0 25px;
}
.primary{
  border:0;
  background:var(--yellow);
  color:var(--black);
  padding:13px 28px;
  border-radius:12px;
  font-size:15px;
  font-weight:800;
}
.section-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  width:720px;
  margin-bottom:25px;
}
.section-card{
  background:var(--ghost);
  border:2px solid var(--pale);
  padding:13px;
  border-radius:12px;
  text-align:left;
}
.section-card b{
  display:block;
  color:var(--purple);
  font-size:14px;
}
.section-card span{
  font-size:12px;
  color:#666;
}
.qtop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.qnum{
  background:var(--ghost);
  border:1px solid var(--pale);
  color:var(--purple);
  padding:7px 13px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}
.timer{

  padding:7px 14px;
  border-radius:20px;
  font-size:13px;
  font-weight:800;
}
.timer.low{

  color:#be123c;
}
.qcard{
  background:var(--ghost);

}
.category{

  font-size:11px;
  font-weight:800;

}
.question{
  font-size:19px;
  font-weight:800;
  line-height:1.4;
}
.scene{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
  min-height:120px;
  max-width:850px;
  margin:0 auto 14px;
  padding:12px 18px;
  border:2px solid var(--pale);
  border-radius:15px;

}
.scene .emoji{
  font-size:65px;
  line-height:1.2;
}
.scene .scene-text{

.block-panel{

}
.sb3 svg{

}
.options{

.option{

}
.option:hover:not(:disabled){

}
.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
}
.option.wrong{
  background:#fff0f1;
  border-color:var(--coral);
  color:#993040;
}

.letter{

}
.option-block{

}
.option-block .sb3{

}
.option-block svg{
  max-width:100%;
  height:auto;
}
.ai-block{

.ai-block.reporter{

.feedback.good{

.feedback.bad{

}
.feedback strong{

  margin-bottom:4px;
}
.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:18px;
  padding-bottom:15px;

.hint{
  font-size:12px;
  font-weight:800;

.next-question{

  background:var(--ghost);
  border:1px solid var(--pale);
  border-radius:11px;
  padding:12px 8px;
  font-size:12px;

  color:var(--purple);
  font-size:20px;

</style>
</head>

<div id="app">
<header>
  <div class="brand">
    <div class="logo">ALPHAGEN LEARNING</div>

<script>
/*
40 kid-friendly questions.
Standard blocks use scratchblocks rendering.
AI extension blocks use labelled visual approximations.

Question types:
- text: short choices
- blocks: visual block choices
- scene: illustration + choices
- predict: block code + output choices
*/

const sections=[
  {name:"QR Code Reader",icon:"▦"},
  {name:"AI Home Automation",icon:"⌂"},
  {name:"Space Shooter",icon:"✦"},
  {name:"PictoBlox Blocks",icon:"▣"}
];

const Q=[

/* =========================
   QR CODE READER — 1–8
========================= */

{
s:0,type:"scene",
q:"What can read this QR code?",
emoji:"▦ 📷",
scene:"SCAN ME!",
o:["QR Code Scanner","Text to Speech","Pen","Music"],
a:0,
e:"The QR Code Scanner extension reads QR codes."
},
{
s:0,type:"scene",
q:"What do we need to scan a QR code?",
emoji:"📷",

o:["Camera","Keyboard only","Speaker","Mouse only"],
a:0,
e:"The camera helps the program see the QR code."
},
{
s:0,type:"scene",
q:"The QR code says HELLO. What will we get?",
emoji:"▦",
scene:"HELLO",
o:["HELLO","GOODBYE","123","Nothing"],
a:0,
e:"A QR reader gives us the information stored inside the code."
},
{
s:0,type:"blocks",
q:"Which block checks a condition?",

"if < > then",

{

{
s:0,type:"blocks",
q:"Which block keeps checking again and again?",

e:"Forever keeps running the blocks inside it."

{

{
s:0,type:"blocks",

"change x by (10)",

/* =========================

{
s:1,type:"scene",

},
{
s:1,type:"scene",
q:"You say 'Lights ON'. What should happen?",

a:0,
e:"The Lights ON command tells the lamp to turn on."
},
{
s:1,type:"ai",
q:"Which AI block listens to our voice?",

"recognize speech for (5) sec in [English]",

],
a:0,
e:"Recognize speech listens to spoken words.",

},
{

{
s:1,type:"scene",
q:"You say 'Radio ON'. What should happen?",
emoji:"📻 🎵",
scene:"Radio ON",
o:["Music plays","Lamp disappears","Fan changes colour","Abby moves left"],
a:0,
e:"The radio plays music when it receives the ON command."

{

q:"Which way does the spaceship move when x increases?",

s:2,type:"blocks",

e:"Change x by 10 moves the sprite right."

{
s:2,type:"scene",
q:"Which key could we use to fire?",
emoji:"🚀 ✨",

s:2,type:"blocks",
q:"Which block checks whether a projectile touches an enemy?",

e:"Change score by 1 adds one point."

{
s:2,type:"scene",
q:"Your score is 5. You earn 2 more points. New score?",

/* =========================

========================= */

{
s:3,type:"blocks",
q:"Which block starts our game?",
o:[

"wait (1) seconds",

"move (10) steps"
],
a:0,
e:"The green flag starts the project."
},
{
s:3,type:"blocks",
q:"Which block runs forever?",

"repeat (10)",

if(Q.length!==40){
  throw new Error("There must be exactly 40 questions.");
}

let slide=0;
let score=0;
let completed=Array(40).fill(false);
let correctResults=Array(40).fill(false);
let answers=Array(40).fill(null);
let remaining=Array(40).fill(40);
let timer=null;
let timeLeft=40;

function scaleApp(){
  const scale=Math.min(
    window.innerWidth/1300,
    window.innerHeight/740,
    1
  );
  document.getElementById("app").style.transform=
    `scale(${scale})`;
}
window.addEventListener("resize",scaleApp);
scaleApp();

function esc(v){
  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function celebrate(){
  if(typeof confetti==="function"){
    confetti({
      particleCount:100,
      spread:70,
      origin:{y:.65},
      colors:["#5E48C4","#FFD071","#59E4FB","#ED5661"]
    });
  }
}

/* Standard PictoBlox/Scratch block rendering */

function blockMarkup(code){
  return `<code class="sb3">${esc(code)}</code>`;
}

function renderBlocks(){
  if(typeof scratchblocks!=="undefined"){
    try{
      scratchblocks.renderMatching(
        "code.sb3",
        {
          style:"scratch3",
          languages:["en"],
          scale:1.05
        }
      );
    }catch(error){
      console.warn("Block rendering unavailable",error);
    }
  }
}

function aiBlockMarkup(text,type){
  return `<span class="ai-block ${
    type==="reporter"?"reporter":""
  }">${esc(text)}</span>`;
}

function optionMarkup(q,text,i){
  if(q.type==="blocks"){
    return `<span class="option-block">${blockMarkup(text)}</span>`;
  }

  if(q.type==="ai"){
    return aiBlockMarkup(text,q.aiTypes[i]);
  }

  return esc(text);
}

function renderScene(q){
  if(q.type!=="scene")return "";

  return `
    <div class="scene">
      <div class="emoji">${esc(q.emoji)}</div>
      <div class="scene-text">${esc(q.scene)}</div>
    </div>
  `;
}

function updateProgress(){
  document.getElementById("progress").innerHTML=
    Q.map((_,i)=>{
      const cls=completed[i]
        ?"done"
        :slide===i+1?"active":"";
      return `<span class="dot ${cls}"></span>`;
    }).join("");
}

function updateNav(){
  document.getElementById("prev").disabled=slide===0;

  const next=document.getElementById("next");

  next.disabled=
    slide===41 ||
    (slide>=1&&slide<=40&&!completed[slide-1]);

  next.innerHTML=slide===40
    ?"View Results →"
    :"Next →";
}

function render(){
  clearInterval(timer);

  const root=document.getElementById("content");
  root.scrollTop=0;

  if(slide===0){
    renderIntro(root);
  }else if(slide===41){
    renderResults(root);
  }else{
    renderQuestion(root,slide-1);
  }

  updateProgress();
  updateNav();

  renderBlocks();
}

function renderIntro(root){
  root.innerHTML=`
    <div class="center">
      <span class="badge">
        ALPHAGEN LEARNING • PICTOBLOX
      </span>

      <h1>
        PictoBlox<br>
        <span>Fun Quiz!</span>
      </h1>

      <p class="intro">
        Ready to test your coding skills?<br>
        40 fun questions • 40 seconds each
      </p>

      <div class="section-grid">
        <div class="section-card">
          <b>▦ QR Code Reader</b>
          <span>8 Questions</span>
        </div>

        <div class="section-card">
          <b>⌂ AI Home Automation</b>
          <span>10 Questions</span>
        </div>

        <div class="section-card">
          <b>✦ Space Shooter</b>
          <span>10 Questions</span>
        </div>

        <div class="section-card">
          <b>▣ PictoBlox Blocks</b>
          <span>12 Questions</span>
        </div>
      </div>

      <button class="primary" onclick="nextSlide()">
        Let's Play! →
      </button>
    </div>
  `;
}

function renderQuestion(root,i){
  const q=Q[i];
  const s=sections[q.s];

  timeLeft=remaining[i];

  root.innerHTML=`
    <div class="qtop">
      <span class="qnum">
        Question ${i+1} of 40 • ${esc(s.name)}
      </span>

      <span class="timer" id="timerBox">
        ⏱ <span id="timerText">${timeLeft}</span>s
      </span>
    </div>

    <div class="qcard">
      <div class="category">${esc(s.name)}</div>
      <div class="question">${esc(q.q)}</div>
    </div>

    ${renderScene(q)}

    <div class="options">
      ${q.o.map((option,j)=>`
        <button class="option" data-choice="${j}"
          onclick="selectAnswer(${i},${j})">
          <span class="letter">
            ${String.fromCharCode(65+j)})
          </span>
          ${optionMarkup(q,option,j)}
        </button>
      `).join("")}
    </div>

    <div id="feedback"></div>

    <div class="bottom">
      <span class="hint">
        Think and choose!
      </span>

      <button class="next-question hidden"
        id="qnext" onclick="nextSlide()">
        ${i===39?"View Results":"Next Question"} →
      </button>
    </div>
  `;

  if(completed[i]){
    restoreQuestion(i);
  }else{
    startTimer(i);
  }
}

function startTimer(i){
  clearInterval(timer);

  if(completed[i])return;

  timeLeft=remaining[i];
  updateTimer();

  timer=setInterval(()=>{
    if(completed[i]){
      clearInterval(timer);
      return;
    }

    timeLeft=Math.max(0,timeLeft-1);
    remaining[i]=timeLeft;
    updateTimer();

    if(timeLeft===0){
      clearInterval(timer);
      finishQuestion(i,false,true);
    }
  },1000);
}

function updateTimer(){
  const el=document.getElementById("timerText");
  const box=document.getElementById("timerBox");

  if(el)el.textContent=timeLeft;

  if(box){
    box.classList.toggle("low",timeLeft<=10);
  }
}

function selectAnswer(i,j){
  if(completed[i]||slide!==i+1)return;

  answers[i]=j;
  finishQuestion(i,j===Q[i].a,false);
}

function markOptions(i){
  const q=Q[i];

  document.querySelectorAll(".option").forEach((btn,j)=>{
    btn.disabled=true;

    if(j===q.a){
      btn.classList.add("correct");
    }else if(j===answers[i]){
      btn.classList.add("wrong");
    }
  });
}

function showFeedback(i,correct,timedOut=false){
  const root=document.getElementById("feedback");
  if(!root)return;

  root.innerHTML=`
    <div class="feedback ${correct?"good":"bad"}">
      <strong>
        ${
          correct
            ?"✓ Great Job! +10 Points"
            :timedOut
              ?"Time is up!"
              :"Let's Learn!"
        }
      </strong>

      <div>${esc(Q[i].e)}</div>
    </div>
  `;
}

function finishQuestion(i,correct,timedOut){
  if(completed[i])return;

  completed[i]=true;
  correctResults[i]=correct;
  clearInterval(timer);

  if(correct){
    score+=10;
    document.getElementById("score").textContent=score;
    celebrate();
  }

  markOptions(i);
  showFeedback(i,correct,timedOut);

  document.getElementById("qnext")
    .classList.remove("hidden");

  updateProgress();
  updateNav();
}

function restoreQuestion(i){
  markOptions(i);
  showFeedback(i,correctResults[i],remaining[i]===0);

  document.getElementById("qnext")
    .classList.remove("hidden");
}

function renderResults(root){
  const groups=sections.map((s,index)=>{
    const ids=Q.map((q,i)=>q.s===index?i:-1)
      .filter(i=>i!==-1);

    return {
      name:s.name,
      correct:ids.filter(i=>correctResults[i]).length,
      total:ids.length
    };
  });

  const correctCount=correctResults.filter(Boolean).length;

  const message=score>=350
    ?"Amazing! You're a PictoBlox superstar!"
    :score>=270
      ?"Great job! You know lots of coding blocks!"
      :score>=180
        ?"Good work! Keep practising!"
        :"Keep building fun projects. You'll get better every time!";

  root.innerHTML=`
    <div class="center">
      <span class="badge">QUIZ COMPLETED!</span>

      <h1>
        Well Done,<br>
        <span>Coder!</span>
      </h1>

      <div class="result-score">
        <div style="font-size:13px;font-weight:800">
          YOUR SCORE
        </div>

        <h2>${score} / 400</h2>

        <div style="font-size:12px">
          ${correctCount} of 40 correct
        </div>
      </div>

      <div class="result-grid">
        ${groups.map(g=>`
          <div class="result-chip">
            <strong>${g.correct}/${g.total}</strong>
            ${esc(g.name)}
          </div>
        `).join("")}
      </div>

      <p class="intro">${esc(message)}</p>

      <button class="primary" onclick="restart()">
        Play Again ↻
      </button>
    </div>
  `;

  if(score>=270)celebrate();
}

function nextSlide(){
  if(slide>=1&&slide<=40&&!completed[slide-1])return;

  if(slide<41){
    slide++;
    render();
  }
}

function previousSlide(){
  if(slide>0){
    slide--;
    render();
  }
}

function restart(){
  slide=0;
  score=0;

  completed=Array(40).fill(false);
  correctResults=Array(40).fill(false);
  answers=Array(40).fill(null);
  remaining=Array(40).fill(40);

  clearInterval(timer);

  document.getElementById("score").textContent="0";
  render();
}

document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)){
    return;
  }

  if(e.key==="ArrowRight")nextSlide();
  if(e.key==="ArrowLeft")previousSlide();
});

render();
</script>
</body>
</html>
