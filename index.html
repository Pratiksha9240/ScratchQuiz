<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>micro:bit Beginners Block Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #00C853 0%, #0091EA 100%);
        }
        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }
        
        /* MakeCode Block Styling */
        .makecode-block {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: bold;
            font-size: 14px;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0px 3px 0px rgba(0,0,0,0.2);
            user-select: none;
        }
        .mb-basic { background-color: #008272; }
        .mb-input { background-color: #D4006D; }
        .mb-music { background-color: #E65100; }
        .mb-led { background-color: #5C6BC0; }
        .mb-loops { background-color: #107C41; }
        .mb-logic { background-color: #00695C; }
        .mb-variables { background-color: #DC3545; }
        .mb-radio { background-color: #E3008C; }
        
        .mb-slot {
            background: white;
            color: #333;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- App Container -->
    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-8 max-w-2xl w-full border-4 border-emerald-300 relative overflow-hidden">
        
        <!-- Header / Score -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <span class="text-3xl">📟</span>
                <h1 class="text-2xl font-fredoka text-emerald-600 tracking-wide drop-shadow-sm">micro:bit Quest!</h1>
            </div>
            <div class="text-right">
                <span id="score" class="text-lg font-bold text-sky-600 bg-sky-100 px-3 py-1 rounded-full">Score: 0</span>
            </div>
        </div>

        <!-- Question Counter & Timer -->
        <div class="flex justify-between items-center bg-emerald-50 rounded-2xl p-3 mb-4 border-2 border-emerald-200">
            <div class="font-bold text-emerald-700" id="question-number">Question 1 of 10</div>
            
            <!-- 25s Countdown Timer -->
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-clock text-amber-500 text-xl"></i>
                <div class="w-24 bg-gray-200 h-4 rounded-full overflow-hidden border border-gray-300">
                    <div id="timer-bar" class="bg-amber-400 h-full w-full transition-all duration-1000 ease-linear"></div>
                </div>
                <span id="timer-text" class="font-fredoka text-amber-600 min-w-[28px] text-right">25s</span>
            </div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-box">
            <h2 id="question-text" class="text-xl font-bold text-slate-800 mb-4 min-h-[56px] flex items-center">
                Loading micro:bit question...
            </h2>

            <!-- Visual Block Diagram Placeholder -->
            <div id="visual-container" class="bg-slate-100 border-2 border-dashed border-slate-300 rounded-2xl p-4 mb-5 flex flex-col items-center justify-center min-h-[130px] text-center">
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
            </div>

            <!-- Feedback & Explanation Card -->
            <div id="feedback-card" class="hidden rounded-2xl p-4 border-2 transition-all">
                <div class="flex items-center gap-2 font-bold text-lg mb-1" id="feedback-title">
                </div>
                <p id="feedback-text" class="text-sm font-medium text-slate-700 leading-relaxed"></p>
            </div>
        </div>

        <!-- Next Button -->
        <button id="next-btn" onclick="nextQuestion()" class="hidden w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-white font-fredoka text-xl py-3 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
            Next Question <i class="fa-solid fa-arrow-right"></i>
        </button>

        <!-- Final Results Screen -->
        <div id="result-screen" class="hidden text-center py-8">
            <div class="text-6xl mb-4 animate-bounce">🤖</div>
            <h2 class="text-3xl font-fredoka text-slate-800 mb-2">Awesome Job!</h2>
            <p class="text-slate-600 font-semibold mb-6">You are now a certified micro:bit Coder!</p>
            
            <div class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-6 mb-6 inline-block w-full max-w-sm">
                <div class="text-sm text-slate-500 uppercase tracking-wider font-bold mb-1">Final Score</div>
                <div class="text-5xl font-fredoka text-emerald-600" id="final-score">0/10</div>
            </div>

            <button onclick="restartQuiz()" class="bg-sky-500 hover:bg-sky-600 text-white font-fredoka text-xl py-3 px-8 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2 mx-auto">
                <i class="fa-solid fa-rotate-right"></i> Try Again
            </button>
        </div>

    </div>

    <script>
        const quizData = [
            {
                type: "Display Basics",
                question: "1. Which block is used to light up a picture on the 5x5 LED grid screen?",
                visual: `<div class="makecode-block mb-basic">show icon <span class="mb-slot">❤️</span></div>`,
                options: [
                    "show icon",
                    "show string",
                    "clear screen",
                    "pause"
                ],
                correct: 0,
                explanation: "The 'show icon' block lets you select built-in pictures like a Heart, Smile, or Duck to light up on the micro:bit LEDs!"
            },
            {
                type: "Button Inputs",
                question: "2. You want code to run ONLY when Button A is pressed. Which input block should you use?",
                visual: `<div class="makecode-block mb-input">on button <span class="mb-slot">A</span> pressed</div>`,
                options: [
                    "on button A pressed",
                    "on shake",
                    "on loud sound",
                    "forever"
                ],
                correct: 0,
                explanation: "'on button A pressed' is an event block that waits until your finger pushes Button A on the micro:bit!"
            },
            {
                type: "Text Scrolling",
                question: "3. Which block scrolls words or letters across the LED screen?",
                visual: `<div class="makecode-block mb-basic">show string <span class="mb-slot">\"Hello!\"</span></div>`,
                options: [
                    "show number",
                    "show string",
                    "show leds",
                    "plot x y"
                ],
                correct: 1,
                explanation: "In coding, words are called 'strings'. The 'show string' block scrolls text across the display one letter at a time."
            },
            {
                type: "Motion Sensing",
                question: "4. Which gesture event triggers when you give your micro:bit a firm shake?",
                visual: `
                    <div class="flex items-center gap-3 bg-white p-3 rounded-xl border border-slate-200">
                        <span class="text-3xl animate-bounce">📟</span>
                        <div class="text-left">
                            <div class="text-xs text-gray-500 font-bold">SENSOR EVENT:</div>
                            <div class="text-sm font-bold text-pink-600">Detecting sudden movement!</div>
                        </div>
                    </div>
                `,
                options: [
                    "on logo touched",
                    "on shake",
                    "on button B pressed",
                    "on screen up"
                ],
                correct: 1,
                explanation: "The micro:bit has an internal accelerometer sensor that detects when you shake it in your hand!"
            },
            {
                type: "Forever Loop",
                question: "5. What is the difference between 'on start' and 'forever' blocks?",
                visual: `
                    <div class="flex flex-col gap-2">
                        <div class="makecode-block mb-basic">on start</div>
                        <div class="makecode-block mb-basic">forever</div>
                    </div>
                `,
                options: [
                    "'on start' runs non-stop continuously",
                    "'forever' runs only once when powered on",
                    "'on start' runs once at boot; 'forever' repeats endlessly",
                    "Both blocks do the exact same thing"
                ],
                correct: 2,
                explanation: "'on start' sets things up once at boot time, while 'forever' repeats its code inside over and over endlessly!"
            },
            {
                type: "Sound & Music",
                question: "6. Which micro:bit block plays a musical tune through the built-in speaker?",
                visual: `<div class="makecode-block mb-music">play melody <span class="mb-slot">ba-ding</span></div>`,
                options: [
                    "play melody",
                    "show leds",
                    "set volume",
                    "record audio"
                ],
                correct: 0,
                explanation: "The 'play melody' block triggers built-in musical sound effects or custom songs on the micro:bit V2 speaker!"
            },
            {
                type: "Temperature Sensor",
                question: "7. Which block reads the room temperature using the micro:bit processor sensor?",
                visual: `<div class="makecode-block mb-input">temperature (°C)</div>`,
                options: [
                    "compass heading",
                    "light level",
                    "temperature (°C)",
                    "acceleration"
                ],
                correct: 2,
                explanation: "The 'temperature (°C)' block returns the current temperature in Celsius measured directly on the micro:bit chip."
            },
            {
                type: "Light Sensing",
                question: "8. How does the micro:bit sense if a room is dark or light without a camera?",
                visual: `
                    <div class="flex items-center gap-3 bg-white p-3 rounded-xl border border-slate-200">
                        <span class="text-3xl">☀️ / 🌙</span>
                        <div class="text-left text-xs font-bold text-slate-600">
                            The 5x5 LED matrix doubles up as a light sensor!
                        </div>
                    </div>
                `,
                options: [
                    "Using the 5x5 LED grid as a light detector",
                    "Using the micro:bit button A",
                    "Using the USB port",
                    "Using the battery connector"
                ],
                correct: 0,
                explanation: "The red LED screen can actually measure light falling on it! The 'light level' block reads numbers from 0 (dark) to 255 (bright)."
            },
            {
                type: "Wireless Radio",
                question: "9. How can two micro:bits send secret messages to each other wirelessly?",
                visual: `<div class="makecode-block mb-radio">radio send string <span class="mb-slot">\"Secret!\"</span></div>`,
                options: [
                    "Using Radio blocks on the same group",
                    "Connecting them with a USB wire",
                    "Shaking both micro:bits at the same time",
                    "Pressing Button A+B together"
                ],
                correct: 0,
                explanation: "The built-in Radio antenna allows micro:bits on the same Radio Group to send string messages and numbers through thin air!"
            },
            {
                type: "Random Numbers",
                question: "10. You are making a Digital Dice. Which block picks a random number between 1 and 6?",
                visual: `<div class="makecode-block mb-logic">pick random <span class="mb-slot">1</span> to <span class="mb-slot">6</span></div>`,
                options: [
                    "pick random 1 to 6",
                    "show number 6",
                    "set roll to 1",
                    "math add 1 + 6"
                ],
                correct: 0,
                explanation: "'pick random 1 to 6' acts like rolling a real dice—it picks an unpredictable integer every time you shake your micro:bit!"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timer = 25;
        let timerInterval = null;
        let optionSelected = false;

        function startTimer() {
            timer = 25;
            optionSelected = false;
            updateTimerDisplay();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                updateTimerDisplay();

                if (timer <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerBar = document.getElementById("timer-bar");
            const timerText = document.getElementById("timer-text");
            
            timerText.innerText = `${timer}s`;
            const percentage = (timer / 25) * 100;
            timerBar.style.width = `${percentage}%`;

            if (timer <= 5) {
                timerBar.className = "bg-red-500 h-full transition-all duration-1000 ease-linear";
            } else if (timer <= 12) {
                timerBar.className = "bg-amber-400 h-full transition-all duration-1000 ease-linear";
            } else {
                timerBar.className = "bg-emerald-400 h-full transition-all duration-1000 ease-linear";
            }
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById("question-number").innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
            document.getElementById("question-text").innerText = q.question;
            document.getElementById("visual-container").innerHTML = q.visual;
            
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn text-left p-4 rounded-xl border-2 border-slate-200 hover:border-emerald-400 bg-white font-semibold text-slate-700 shadow-sm transition hover:shadow-md active:scale-98 flex items-center justify-between";
                btn.onclick = () => selectOption(idx);
                btn.id = `opt-${idx}`;
                btn.innerHTML = `<span>${opt}</span><i class="opt-icon fa-regular fa-circle text-slate-300"></i>`;
                optionsContainer.appendChild(btn);
            });

            // Reset UI States
            document.getElementById("feedback-card").className = "hidden rounded-2xl p-4 border-2 transition-all";
            document.getElementById("next-btn").classList.add("hidden");

            startTimer();
        }

        function selectOption(index) {
            if (optionSelected) return;
            optionSelected = true;
            clearInterval(timerInterval);

            const q = quizData[currentQuestion];
            const isCorrect = index === q.correct;

            if (isCorrect) score++;
            document.getElementById("score").innerText = `Score: ${score}`;

            highlightOptions(q.correct, index);
            showFeedback(isCorrect, q.explanation);
        }

        function handleTimeout() {
            if (optionSelected) return;
            optionSelected = true;

            const q = quizData[currentQuestion];
            highlightOptions(q.correct, -1);
            showFeedback(false, "Time's up! " + q.explanation);
        }

        function highlightOptions(correctIdx, selectedIdx) {
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                const icon = btn.querySelector(".opt-icon");

                if (idx === correctIdx) {
                    btn.className = "option-btn text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-800 shadow-sm flex items-center justify-between";
                    icon.className = "opt-icon fa-solid fa-circle-check text-emerald-500 text-xl";
                } else if (idx === selectedIdx) {
                    btn.className = "option-btn text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50 font-bold text-rose-800 shadow-sm flex items-center justify-between";
                    icon.className = "opt-icon fa-solid fa-circle-xmark text-rose-500 text-xl";
                } else {
                    btn.className = "option-btn text-left p-4 rounded-xl border-2 border-slate-100 bg-slate-50 opacity-60 text-slate-400 flex items-center justify-between";
                }
            });
        }

        function showFeedback(isCorrect, text) {
            const card = document.getElementById("feedback-card");
            const title = document.getElementById("feedback-title");
            const desc = document.getElementById("feedback-text");

            card.classList.remove("hidden");
            if (isCorrect) {
                card.className = "rounded-2xl p-4 border-2 border-emerald-300 bg-emerald-50 transition-all";
                title.className = "flex items-center gap-2 font-bold text-lg mb-1 text-emerald-700";
                title.innerHTML = `<i class="fa-solid fa-face-smile text-2xl"></i> Correct! Well done!`;
            } else {
                card.className = "rounded-2xl p-4 border-2 border-rose-300 bg-rose-50 transition-all";
                title.className = "flex items-center gap-2 font-bold text-lg mb-1 text-rose-700";
                title.innerHTML = `<i class="fa-solid fa-face-frown text-2xl"></i> Oops! Let's check why:`;
            }

            desc.innerText = text;
            document.getElementById("next-btn").classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            clearInterval(timerInterval);
            document.getElementById("quiz-box").classList.add("hidden");
            document.getElementById("next-btn").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score").innerText = `${score}/${quizData.length}`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById("score").innerText = `Score: 0`;
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("quiz-box").classList.remove("hidden");
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
