<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PictoBlox AI Home Automation Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4c1d95 0%, #1e1b4b 100%);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-container {
            background-color: #2e1065;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.3);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border: 4px solid #a855f7;
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #581c87;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: #facc15;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .badge {
            background: linear-gradient(90deg, #ec4899, #f43f5e);
            color: white;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 9999px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(236, 72, 153, 0.4);
        }

        /* --- QUIZ STYLES --- */
        #quiz-screen {
            animation: fadeIn 0.4s ease-in-out;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #3b0764;
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid #7e22ce;
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            color: #f43f5e;
        }

        .timer-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: conic-gradient(#f43f5e 100%, #581c87 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .timer-circle::before {
            content: '';
            position: absolute;
            width: 34px;
            height: 34px;
            background-color: #3b0764;
            border-radius: 50%;
        }

        .timer-text {
            position: relative;
            z-index: 1;
            font-size: 16px;
            color: white;
        }

        .score-box {
            font-size: 18px;
            font-weight: 800;
            color: #4ade80;
        }

        .progress-bar {
            height: 10px;
            width: 100%;
            background-color: #581c87;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            width: 10%;
            transition: width 0.4s ease;
        }

        .question-box {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 15px;
            color: #f3e8ff;
        }

        .code-snippet {
            background-color: #1e1b4b;
            border-left: 5px solid #facc15;
            padding: 14px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 15px;
            color: #f1f5f9;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #3b0764;
            color: #f3e8ff;
            border: 2px solid #6b21a8;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #581c87;
            border-color: #a855f7;
            transform: translateX(5px);
        }

        .option-btn.correct {
            background-color: #14532d !important;
            border-color: #22c55e !important;
            color: #bbf7d0 !important;
            animation: pulseGreen 0.4s ease;
        }

        .option-btn.wrong {
            background-color: #7f1d1d !important;
            border-color: #ef4444 !important;
            color: #fecdd3 !important;
            animation: shake 0.4s ease;
        }

        .explanation-box {
            background-color: #1e1b4b;
            border: 2px solid #38bdf8;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .explanation-title {
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .explanation-text {
            font-size: 14px;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .next-btn {
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
            margin-left: auto;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }

        /* --- RESULTS STYLES --- */
        .results-card {
            text-align: center;
            display: none;
            animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .results-card h2 {
            font-size: 34px;
            color: #facc15;
            margin-bottom: 10px;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-color: #1e1b4b;
            border: 6px solid #22c55e;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 25px auto;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
        }

        .score-num {
            font-size: 44px;
            font-weight: 800;
            color: #4ade80;
        }

        .restart-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }

        /* --- POPUP MODAL --- */
        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background-color: #2e1065;
            border: 4px solid #facc15;
            padding: 25px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .popup-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @keyframes pulseGreen {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- QUIZ SCREEN -->
    <div id="quiz-screen">
        <div class="header">
            <div class="title">🤖 PictoBlox AI Home Automation Assessment</div>
            <div class="badge" id="question-number">Q1 / 10</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="stats-bar">
            <div class="timer-box">
                <div class="timer-circle" id="timer-circle">
                    <span class="timer-text" id="timer-text">25</span>
                </div>
                <span>Sec Left</span>
            </div>
            <div class="score-box">
                Score: <span id="current-score">0</span> pts
            </div>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">Loading question...</div>
            <div class="code-snippet" id="code-snippet" style="display: none;"></div>
        </div>

        <div class="options-grid" id="options-grid"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="explanation-title">💡 Logic Explanation</div>
            <div class="explanation-text" id="explanation-text"></div>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div class="results-card" id="results-screen">
        <h2>🎉 Assessment Complete!</h2>
        <p style="font-size: 18px; color: #e9d5ff;">Here is the performance breakdown for AI Home Automation concepts:</p>
        
        <div class="score-circle">
            <div class="score-num" id="final-score">0/10</div>
            <div style="font-size: 12px; color: #a855f7; font-weight: 800;">TOTAL SCORE</div>
        </div>

        <p id="feedback-msg" style="font-size: 18px; font-weight: 700; margin-bottom: 20px;"></p>

        <button class="restart-btn" onclick="restartQuiz()">Retake Quiz 🔄</button>
    </div>

    <!-- POPUP MODAL -->
    <div class="popup-modal" id="popup-modal">
        <div style="font-size: 50px; margin-bottom: 5px;" id="popup-emoji">🎉</div>
        <div style="font-size: 22px; font-weight: 800;" id="popup-title">Awesome!</div>
        <p style="margin: 5px 0 0 0; color: #e9d5ff;" id="popup-sub"></p>
    </div>
</div>

<script>
    /* ===================================================
       SYNTHESIZED AUDIO ENGINE (No External Media Files)
       =================================================== */
    let audioCtx = null;

    function playSound(type) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(174.61, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        } catch(e) {}
    }

    /* ===================================================
       QUIZ DATA & ENGINE
       =================================================== */
    const questions = [
        {
            q: "In PictoBlox, which extension allows you to recognize spoken voice commands like 'turn on lights' to control a smart home?",
            code: null,
            options: [
                { text: "Speech Recognition / Artificial Intelligence Extension", correct: true, exp: "The Speech Recognition and AI extensions process audio input and convert speech into text commands." },
                { text: "Pen Extension", correct: false, exp: "The Pen extension draws shapes on the stage." },
                { text: "Music Extension", correct: false, exp: "Plays instrument notes and sound effects." },
                { text: "Text to Speech Extension", correct: false, exp: "Converts text into spoken audio output rather than recognizing user speech." }
            ]
        },
        {
            q: "What is the primary function of Artificial Intelligence (AI) in an AI-powered Home Automation system?",
            code: null,
            options: [
                { text: "To manually click buttons on the screen", correct: false, exp: "Manual clicking does not require AI." },
                { text: "To analyze inputs (like face, speech, or gestures) and make smart decisions automatically", correct: true, exp: "AI interprets sensory input like voice or face data to trigger smart home devices automatically." },
                { text: "To replace hardware microcontrollers completely", correct: false, exp: "AI works alongside microcontrollers (like Quarky or Evive) to control real hardware." },
                { text: "To change backdrop colors randomly", correct: false, exp: "That is basic visual animation, not AI logic." }
            ]
        },
        {
            q: "Which PictoBlox Artificial Intelligence block is used to continuously analyze images from the camera for face or gesture recognition?",
            code: "forever\n    analyse image from [camera v]\nend",
            options: [
                { text: "analyse image from [camera]", correct: true, exp: "'analyse image from camera' captures video frames and runs AI model inference on them continuously." },
                { text: "turn camera off", correct: false, exp: "Disables image processing." },
                { text: "say [Processing...]", correct: false, exp: "Displays text speech bubbles." },
                { text: "play sound [Meow]", correct: false, exp: "Triggers audio output." }
            ]
        },
        {
            q: "How can facial recognition AI enhance a Smart Home Security Gate system in PictoBlox?",
            code: null,
            options: [
                { text: "By opening the door automatically when a recognized family member is detected", correct: true, exp: "Facial recognition matches stored face models to safely unlock doors for authorized family members." },
                { text: "By turning off the Wi-Fi connection", correct: false, exp: "Smart security systems rely on connections to process and alert." },
                { text: "By changing room temperatures randomly", correct: false, exp: "Facial recognition deals with identity, not HVAC control." },
                { text: "By playing music when someone touches a key", correct: false, exp: "This is basic key sensing, not face recognition security." }
            ]
        },
        {
            q: "When using the Natural Language Processing (NLP) or Speech Recognition blocks, what condition checks if the user said 'turn on fan'?",
            code: "if <(speech result) contains [turn on fan]?> then\n    set pin (13) output [HIGH v]\nend",
            options: [
                { text: "if <speech result contains 'turn on fan'>", correct: true, exp: "Checking if the parsed speech result contains specific keywords triggers the appropriate smart appliance output." },
                { text: "if <loudness > 50>", correct: false, exp: "Loudness checks sound volume, not spoken command words." },
                { text: "if <touching mouse-pointer?>", correct: false, exp: "Detects cursor hover, not speech." },
                { text: "if <key space pressed?>", correct: false, exp: "Checks physical key presses." }
            ]
        },
        {
            q: "Which electronic component controlled via PictoBlox acts as an automated switch to turn high-voltage home lights ON or OFF?",
            code: null,
            options: [
                { text: "Relay Module", correct: true, exp: "Relays allow low-voltage microcontrollers (like Quarky/Arduino) to safely control high-voltage home appliances." },
                { text: "Ultrasonic Sensor", correct: false, exp: "Measures distance, does not switch appliances." },
                { text: "LDR (Light Dependent Resistor)", correct: false, exp: "Senses ambient light levels." },
                { text: "Buzzer", correct: false, exp: "Emits audio alert sounds." }
            ]
        },
        {
            q: "How does an AI-enabled Smart Lighting system automatically turn lights on when a person enters a room?",
            code: "forever\n    analyse image from [camera v]\n    if <(number of faces) > [0]> then\n        turn ON room light\n    else\n        turn OFF room light\n    end\nend",
            options: [
                { text: "By checking if 'number of faces detected' is greater than 0 using computer vision", correct: true, exp: "Computer vision detects human presence by counting faces in the camera frame to manage lighting efficiency." },
                { text: "By waiting for the user to press a spacebar", correct: false, exp: "Manual input defeats automated AI detection." },
                { text: "By resetting the timer every second", correct: false, exp: "Timers do not sense physical human presence." },
                { text: "By checking if mouse is down", correct: false, exp: "Mouse input is not automated room sensing." }
            ]
        },
        {
            q: "Which PictoBlox extension allows you to train your own custom Machine Learning models (e.g., recognizing custom hand gestures for appliance control)?",
            code: null,
            options: [
                { text: "Teachable Machine / Machine Learning Environment", correct: true, exp: "Teachable Machine in PictoBlox lets users train custom image, pose, or audio models for home automation control." },
                { text: "Paint Editor", correct: false, exp: "Used for creating sprite costumes." },
                { text: "Sound Editor", correct: false, exp: "Used for trimming and modifying audio clips." },
                { text: "Variable Manager", correct: false, exp: "Used for creating numerical and string data variables." }
            ]
        },
        {
            q: "In an automated Smart Home HVAC system, how do AI and sensors work together efficiently?",
            code: null,
            options: [
                { text: "Sensors gather environmental data (temperature/presence), and AI predicts/adjusts the ideal cooling state", correct: true, exp: "Combining sensor telemetry with AI decision-making optimizes comfort and reduces energy consumption." },
                { text: "The system runs full power 24/7 without stopping", correct: false, exp: "Continuous operation wastes energy and ignores smart automation." },
                { text: "AI deletes sensor code whenever it gets warm", correct: false, exp: "AI executes code logic rather than deleting project scripts." },
                { text: "Sensors replace the main microcontroller unit", correct: false, exp: "Sensors supply inputs to microcontrollers, they do not replace them." }
            ]
        },
        {
            q: "Why is Machine Learning Model Training necessary before running an AI Home Automation gesture recognition system?",
            code: null,
            options: [
                { text: "To teach the AI algorithm to distinguish between different gestures by collecting sample images", correct: true, exp: "Supervised ML training requires dataset samples so the AI can accurately classify new user gestures in real time." },
                { text: "To make the microchip consume less electricity", correct: false, exp: "Model training teaches classification, not power management." },
                { text: "To increase speaker volume output", correct: false, exp: "Volume is an audio hardware property." },
                { text: "To draw background graphics in PictoBlox", correct: false, exp: "Graphic design is unrelated to model training." }
            ]
        }
    ];

    let currentQ = 0;
    let quizScore = 0;
    let quizTimer;
    let quizTimeLeft = 25;
    let answered = false;

    function loadQuestion() {
        answered = false;
        clearInterval(quizTimer);
        quizTimeLeft = 25;
        updateTimerUI();
        
        const q = questions[currentQ];
        document.getElementById('question-number').innerText = `Q${currentQ + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-fill').style.width = `${((currentQ + 1) / questions.length) * 100}%`;
        
        const codeBox = document.getElementById('code-snippet');
        if (q.code) {
            codeBox.innerText = q.code;
            codeBox.style.display = 'block';
        } else {
            codeBox.style.display = 'none';
        }

        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}) ${opt.text}</span>`;
            btn.onclick = () => selectOption(idx);
            grid.appendChild(btn);
        });

        quizTimer = setInterval(() => {
            quizTimeLeft--;
            updateTimerUI();
            if (quizTimeLeft <= 5 && quizTimeLeft > 0) playSound('tick');
            if (quizTimeLeft <= 0) {
                clearInterval(quizTimer);
                autoTimeOut();
            }
        }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('timer-text').innerText = quizTimeLeft;
        const pct = (quizTimeLeft / 25) * 100;
        document.getElementById('timer-circle').style.background = `conic-gradient(#f43f5e ${pct}%, #581c87 0%)`;
    }

    function selectOption(idx) {
        if (answered) return;
        answered = true;
        clearInterval(quizTimer);

        const q = questions[currentQ];
        const selected = q.options[idx];
        const btns = document.querySelectorAll('.option-btn');

        btns.forEach((btn, i) => {
            btn.disabled = true;
            if (q.options[i].correct) {
                btn.classList.add('correct');
            }
        });

        if (selected.correct) {
            btns[idx].classList.add('correct');
            quizScore++;
            document.getElementById('current-score').innerText = quizScore * 10;
            playSound('correct');
            showPopup(true, "Correct!", "Great job on PictoBlox logic.");
        } else {
            btns[idx].classList.add('wrong');
            playSound('wrong');
            showPopup(false, "Incorrect", "Review the logic explanation below.");
        }

        document.getElementById('explanation-text').innerText = selected.exp;
        document.getElementById('explanation-box').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function autoTimeOut() {
        if (answered) return;
        answered = true;

        const q = questions[currentQ];
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((btn, i) => {
            btn.disabled = true;
            if (q.options[i].correct) btn.classList.add('correct');
        });

        playSound('wrong');
        showPopup(false, "Time's Up!", "Keep an eye on the countdown.");

        document.getElementById('explanation-text').innerText = "Time expired! Monitor the timer closely while analyzing PictoBlox AI blocks.";
        document.getElementById('explanation-box').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function showPopup(isCorrect, title, sub) {
        const modal = document.getElementById('popup-modal');
        document.getElementById('popup-emoji').innerText = isCorrect ? "🎉" : "🤖";
        document.getElementById('popup-title').innerText = title;
        document.getElementById('popup-title').style.color = isCorrect ? "#4ade80" : "#f43f5e";
        document.getElementById('popup-sub').innerText = sub;

        modal.classList.add('active');
        setTimeout(() => {
            modal.classList.remove('active');
        }, 1500);
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${quizScore}/${questions.length}`;

        const msg = document.getElementById('feedback-msg');
        if (quizScore === 10) {
            msg.innerText = "Perfect Score! You understand PictoBlox AI Home Automation inside and out.";
            msg.style.color = "#4ade80";
        } else if (quizScore >= 7) {
            msg.innerText = "Great Work! Solid understanding of AI blocks and smart home hardware.";
            msg.style.color = "#38bdf8";
        } else {
            msg.innerText = "Needs Review! Go back over the AI extension blocks and retry.";
            msg.style.color = "#facc15";
        }
    }

    function restartQuiz() {
        currentQ = 0;
        quizScore = 0;
        document.getElementById('current-score').innerText = 0;
        document.getElementById('results-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    // Initialize Quiz immediately on load
    loadQuestion();
</script>
