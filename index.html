<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Flappy Bird Coding Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #4ec0ca 0%, #2094fa 100%);
        }
        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }
        
        /* Scratch Block Styling */
        .scratch-block {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: bold;
            font-size: 14px;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0px 3px 0px rgba(0,0,0,0.2);
            user-select: none;
        }
        .sb-hat {
            background-color: #ffbf00;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            color: #4c3e00;
        }
        .sb-motion { background-color: #4c97ff; }
        .sb-looks { background-color: #9966ff; }
        .sb-control { background-color: #ffab19; }
        .sb-sensing { background-color: #5cb1d6; }
        .sb-variables { background-color: #ff8c1a; }
        .sb-operators { background-color: #59c059; }
        .sb-slot {
            background: white;
            color: #333;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 13px;
        }

        /* Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }
        .animate-pulse-slow {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container -->
    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-8 max-w-2xl w-full border-4 border-yellow-300 relative overflow-hidden">
        
        <!-- Header / Progress Bar -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🐤</span>
                <h1 class="text-2xl font-fredoka text-yellow-500 tracking-wide drop-shadow-sm">Flappy Scratch!</h1>
            </div>
            <div class="text-right">
                <span id="score" class="text-lg font-bold text-sky-600 bg-sky-100 px-3 py-1 rounded-full">Score: 0</span>
            </div>
        </div>

        <!-- Question Counter & Timer -->
        <div class="flex justify-between items-center bg-sky-50 rounded-2xl p-3 mb-4 border-2 border-sky-200">
            <div class="font-bold text-sky-700" id="question-number">Question 1 of 10</div>
            
            <!-- 25s Countdown Timer -->
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-clock text-amber-500 text-xl"></i>
                <div class="w-24 bg-gray-200 h-4 rounded-full overflow-hidden border border-gray-300">
                    <div id="timer-bar" class="bg-amber-400 h-full w-full transition-all duration-1000 ease-linear"></div>
                </div>
                <span id="timer-text" class="font-fredoka text-amber-600 min-w-[28px] text-right">25s</span>
            </div>
        </div>

        <!-- Question Container -->
        <div id="quiz-box">
            <!-- Question Title -->
            <h2 id="question-text" class="text-xl font-bold text-slate-800 mb-4 min-h-[56px] flex items-center">
                Loading question...
            </h2>

            <!-- Image/Visual Placeholder -->
            <div id="visual-container" class="bg-sky-100/70 border-2 border-dashed border-sky-300 rounded-2xl p-4 mb-5 flex flex-col items-center justify-center min-h-[140px] text-center">
                <!-- Dynamic Visual content will be injected here -->
            </div>

            <!-- 4 Answer Options -->
            <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                <!-- Buttons injected dynamically -->
            </div>

            <!-- Feedback / Explanation Card -->
            <div id="feedback-card" class="hidden rounded-2xl p-4 border-2 transition-all">
                <div class="flex items-center gap-2 font-bold text-lg mb-1" id="feedback-title">
                    <!-- Icon + Status -->
                </div>
                <p id="feedback-text" class="text-sm font-medium text-slate-700 leading-relaxed"></p>
            </div>
        </div>

        <!-- Next / Finish Button -->
        <button id="next-btn" onclick="nextQuestion()" class="hidden w-full mt-4 bg-yellow-400 hover:bg-yellow-500 text-amber-950 font-fredoka text-xl py-3 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
            Next Question <i class="fa-solid fa-arrow-right"></i>
        </button>

        <!-- Final Results Screen (Hidden initially) -->
        <div id="result-screen" class="hidden text-center py-8">
            <div class="text-6xl mb-4 animate-bounce">🏆</div>
            <h2 class="text-3xl font-fredoka text-slate-800 mb-2">Quiz Completed!</h2>
            <p class="text-slate-600 font-semibold mb-6">You're a Flappy Bird Scratch Master!</p>
            
            <div class="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-6 mb-6 inline-block w-full max-w-sm">
                <div class="text-sm text-slate-500 uppercase tracking-wider font-bold mb-1">Final Score</div>
                <div class="text-5xl font-fredoka text-yellow-500" id="final-score">0/10</div>
            </div>

            <button onclick="restartQuiz()" class="bg-sky-500 hover:bg-sky-600 text-white font-fredoka text-xl py-3 px-8 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2 mx-auto">
                <i class="fa-solid fa-rotate-right"></i> Play Again
            </button>
        </div>

    </div>

    <script>
        const quizData = [
            {
                type: "Event Trigger",
                question: "1. Which Scratch event block is best to start your Flappy Bird game when the Green Flag is clicked?",
                visual: `<div class="scratch-block sb-hat"><i class="fa-solid fa-flag"></i> when green flag clicked</div>`,
                options: [
                    "when green flag clicked",
                    "when space key pressed",
                    "when this sprite clicked",
                    "when I receive start"
                ],
                correct: 0,
                explanation: "The 'when green flag clicked' block resets and starts the entire game from the very beginning!"
            },
            {
                type: "Flap Mechanics",
                question: "2. How do you make Flappy Bird jump UP when you press the Space key?",
                visual: `
                    <div class="flex items-center gap-2 bg-white p-3 rounded-xl border border-sky-200">
                        <span class="text-3xl">🐤</span>
                        <div class="text-left">
                            <div class="text-xs text-gray-500 font-bold">TARGET ACTION:</div>
                            <div class="text-sm font-bold text-sky-600">Jump 10 steps UP on Y-axis</div>
                        </div>
                    </div>
                `,
                options: [
                    "change y by 10",
                    "change x by 10",
                    "change y by -10",
                    "turn 15 degrees"
                ],
                correct: 0,
                explanation: "In Scratch, positive Y values move sprites UP! So 'change y by 10' pushes the bird upward."
            },
            {
                type: "Gravity Simulation",
                question: "3. Flappy Bird needs gravity to fall down continuously. Which block makes the bird fall?",
                visual: `
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-3xl animate-bounce">🐤</span>
                        <i class="fa-solid fa-arrow-down text-red-500 text-xl"></i>
                    </div>
                `,
                options: [
                    "change y by 10",
                    "change y by -5",
                    "change x by -5",
                    "set y to 0"
                ],
                correct: 1,
                explanation: "Negative Y numbers pull the bird downwards toward the ground, simulating real gravity!"
            },
            {
                type: "Pipe Obstacle Movement",
                question: "4. The pipe obstacles move from the right side of the screen to the left. Which block does this?",
                visual: `
                    <div class="flex items-center gap-4 bg-white p-3 rounded-xl border border-sky-200">
                        <div class="text-2xl">🟢</div>
                        <i class="fa-solid fa-left-long text-sky-500 text-2xl"></i>
                        <span class="text-xs font-bold text-slate-500">Pipe moves Left</span>
                    </div>
                `,
                options: [
                    "change y by 5",
                    "change x by 5",
                    "change x by -8",
                    "point in direction 180"
                ],
                correct: 2,
                explanation: "Negative X values move sprites to the LEFT. Changing X by -8 makes pipes scroll smoothly past the bird!"
            },
            {
                type: "Collision Detection",
                question: "5. How do we detect if Flappy Bird hits a pipe or crashes into the ground?",
                visual: `
                    <div class="scratch-block sb-sensing">
                        touching <span class="sb-slot">Pipe 🟢</span> ?
                    </div>
                `,
                options: [
                    "if touching Pipe? then",
                    "if key space pressed? then",
                    "if mouse down? then",
                    "if distance < 10 then"
                ],
                correct: 0,
                explanation: "The 'touching [sprite]?' sensing block checks if two sprites are touching each other to trigger Game Over!"
            },
            {
                type: "Score Counter",
                question: "6. Which block increases your score by 1 every time you safely clear a pipe?",
                visual: `
                    <div class="scratch-block sb-variables">
                        change <span class="sb-slot">Score 🏆</span> by 1
                    </div>
                `,
                options: [
                    "set Score to 1",
                    "change Score by 1",
                    "show variable Score",
                    "Score = 1"
                ],
                correct: 1,
                explanation: "'change [Score] by 1' adds 1 to your current score. 'set Score to 1' would reset your score to 1 every time!"
            },
            {
                type: "End Game Logic",
                question: "7. When Flappy Bird crashes, what block stops all scripts so the game ends?",
                visual: `
                    <div class="bg-red-100 border-2 border-red-300 p-3 rounded-xl text-red-600 font-bold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-hand text-xl"></i> GAME OVER!
                    </div>
                `,
                options: [
                    "stop [all]",
                    "hide",
                    "wait 1 secs",
                    "delete this clone"
                ],
                correct: 0,
                explanation: "The 'stop [all]' control block freezes the entire game, bringing everything to a complete stop on Game Over!"
            },
            {
                type: "Cloning Pipes",
                question: "8. To create endless incoming pipes without making 100 sprites, what Scratch feature do we use?",
                visual: `
                    <div class="scratch-block sb-control">
                        create clone of <span class="sb-slot">myself</span>
                    </div>
                `,
                options: [
                    "costume switches",
                    "broadcast messages",
                    "Clones (create clone of myself)",
                    "stamp tool"
                ],
                correct: 2,
                explanation: "Cloning allows one Pipe sprite to duplicate itself forever to make continuous obstacles!"
            },
            {
                type: "Random Pipe Heights",
                question: "9. To make pipe gaps appear at random heights, which operator block should we place in 'set y to ...'?",
                visual: `
                    <div class="scratch-block sb-operators">
                        pick random <span class="sb-slot">-80</span> to <span class="sb-slot">80</span>
                    </div>
                `,
                options: [
                    "pick random -80 to 80",
                    "join hello world",
                    "round 80",
                    "80 + 80"
                ],
                correct: 0,
                explanation: "The 'pick random' operator chooses a different height every time a pipe spawns, making the game fun and unpredictable!"
            },
            {
                type: "Game Initialization",
                question: "10. When starting a fresh game, what should happen to the Score variable?",
                visual: `
                    <div class="scratch-block sb-variables">
                        set <span class="sb-slot">Score 🏆</span> to 0
                    </div>
                `,
                options: [
                    "change Score by 1",
                    "set Score to 0",
                    "show variable Score",
                    "hide variable Score"
                ],
                correct: 1,
                explanation: "Always reset your score back to 0 at the start of a new game using 'set Score to 0'!"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timer = 25;
        let timerInterval = null;
        let optionSelected = false;

        function startTimer() {
            timer = 25;
            optionSelected = false;
            updateTimerDisplay();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                updateTimerDisplay();

                if (timer <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerBar = document.getElementById("timer-bar");
            const timerText = document.getElementById("timer-text");
            
            timerText.innerText = `${timer}s`;
            const percentage = (timer / 25) * 100;
            timerBar.style.width = `${percentage}%`;

            if (timer <= 5) {
                timerBar.className = "bg-red-500 h-full transition-all duration-1000 ease-linear";
            } else if (timer <= 12) {
                timerBar.className = "bg-amber-400 h-full transition-all duration-1000 ease-linear";
            } else {
                timerBar.className = "bg-emerald-400 h-full transition-all duration-1000 ease-linear";
            }
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById("question-number").innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
            document.getElementById("question-text").innerText = q.question;
            document.getElementById("visual-container").innerHTML = q.visual;
            
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn text-left p-4 rounded-xl border-2 border-slate-200 hover:border-sky-400 bg-white font-semibold text-slate-700 shadow-sm transition hover:shadow-md active:scale-98 flex items-center justify-between";
                btn.onclick = () => selectOption(idx);
                btn.id = `opt-${idx}`;
                btn.innerHTML = `<span>${opt}</span><i class="opt-icon fa-regular fa-circle text-slate-300"></i>`;
                optionsContainer.appendChild(btn);
            });

            // Reset Feedback & Next Button
            const feedbackCard = document.getElementById("feedback-card");
            feedbackCard.className = "hidden rounded-2xl p-4 border-2 transition-all";
            document.getElementById("next-btn").classList.add("hidden");

            startTimer();
        }

        function selectOption(index) {
            if (optionSelected) return;
            optionSelected = true;
            clearInterval(timerInterval);

            const q = quizData[currentQuestion];
            const isCorrect = index === q.correct;

            if (isCorrect) score++;
            document.getElementById("score").innerText = `Score: ${score}`;

            highlightOptions(q.correct, index);
            showFeedback(isCorrect, q.explanation);
        }

        function handleTimeout() {
            if (optionSelected) return;
            optionSelected = true;

            const q = quizData[currentQuestion];
            highlightOptions(q.correct, -1);
            showFeedback(false, "Time's up! " + q.explanation);
        }

        function highlightOptions(correctIdx, selectedIdx) {
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                const icon = btn.querySelector(".opt-icon");

                if (idx === correctIdx) {
                    btn.className = "option-btn text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-800 shadow-sm flex items-center justify-between";
                    icon.className = "opt-icon fa-solid fa-circle-check text-emerald-500 text-xl";
                } else if (idx === selectedIdx) {
                    btn.className = "option-btn text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50 font-bold text-rose-800 shadow-sm flex items-center justify-between";
                    icon.className = "opt-icon fa-solid fa-circle-xmark text-rose-500 text-xl";
                } else {
                    btn.className = "option-btn text-left p-4 rounded-xl border-2 border-slate-100 bg-slate-50 opacity-60 text-slate-400 flex items-center justify-between";
                }
            });
        }

        function showFeedback(isCorrect, text) {
            const card = document.getElementById("feedback-card");
            const title = document.getElementById("feedback-title");
            const desc = document.getElementById("feedback-text");

            card.classList.remove("hidden");
            if (isCorrect) {
                card.className = "rounded-2xl p-4 border-2 border-emerald-300 bg-emerald-50 transition-all";
                title.className = "flex items-center gap-2 font-bold text-lg mb-1 text-emerald-700";
                title.innerHTML = `<i class="fa-solid fa-face-smile text-2xl"></i> Correct! Great Job!`;
            } else {
                card.className = "rounded-2xl p-4 border-2 border-rose-300 bg-rose-50 transition-all";
                title.className = "flex items-center gap-2 font-bold text-lg mb-1 text-rose-700";
                title.innerHTML = `<i class="fa-solid fa-face-frown text-2xl"></i> Oops! Let's Learn!`;
            }

            desc.innerText = text;
            document.getElementById("next-btn").classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            clearInterval(timerInterval);
            document.getElementById("quiz-box").classList.add("hidden");
            document.getElementById("next-btn").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score").innerText = `${score}/${quizData.length}`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById("score").innerText = `Score: 0`;
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("quiz-box").classList.remove("hidden");
            loadQuestion();
        }

        // Initialize App
        window.onload = loadQuestion;
    </script>
</body>
</html>
