<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PictoBlox AI Home Automation Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4c1d95 0%, #1e1b4b 100%);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-container {
            background-color: #2e1065;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.3);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border: 4px solid #a855f7;
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #581c87;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            color: #facc15;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: linear-gradient(90deg, #ec4899, #f43f5e);
            color: white;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 9999px;
            font-weight: 800;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #3b0764;
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid #7e22ce;
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            color: #f43f5e;
        }

        .timer-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: conic-gradient(#f43f5e 100%, #581c87 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .timer-circle::before {
            content: '';
            position: absolute;
            width: 34px;
            height: 34px;
            background-color: #3b0764;
            border-radius: 50%;
        }

        .timer-text {
            position: relative;
            z-index: 1;
            font-size: 16px;
            color: white;
        }

        .score-box {
            font-size: 18px;
            font-weight: 800;
            color: #4ade80;
        }

        .progress-bar {
            height: 10px;
            width: 100%;
            background-color: #581c87;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            width: 10%;
            transition: width 0.4s ease;
        }

        .question-box {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 15px;
            color: #f3e8ff;
        }

        .code-snippet {
            background-color: #1e1b4b;
            border-left: 5px solid #facc15;
            padding: 14px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #f1f5f9;
            white-space: pre-wrap;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #3b0764;
            color: #f3e8ff;
            border: 2px solid #6b21a8;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #581c87;
            border-color: #a855f7;
            transform: translateX(5px);
        }

        .option-btn.correct {
            background-color: #14532d !important;
            border-color: #22c55e !important;
            color: #bbf7d0 !important;
        }

        .option-btn.wrong {
            background-color: #7f1d1d !important;
            border-color: #ef4444 !important;
            color: #fecdd3 !important;
        }

        .explanation-box {
            background-color: #1e1b4b;
            border: 2px solid #38bdf8;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        .explanation-title {
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .explanation-text {
            font-size: 14px;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .next-btn {
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            display: none;
            margin-left: auto;
        }

        .results-card {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #1e1b4b;
            border: 6px solid #22c55e;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 20px auto;
        }

        .score-num {
            font-size: 40px;
            font-weight: 800;
            color: #4ade80;
        }

        .restart-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div id="quiz-screen">
        <div class="header">
            <div class="title">🤖 STEMpedia PictoBlox AI Home Automation Quiz</div>
            <div class="badge" id="question-number">Q1 / 10</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="stats-bar">
            <div class="timer-box">
                <div class="timer-circle" id="timer-circle">
                    <span class="timer-text" id="timer-text">25</span>
                </div>
                <span>Sec Left</span>
            </div>
            <div class="score-box">
                Score: <span id="current-score">0</span> pts
            </div>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">Loading...</div>
            <div class="code-snippet" id="code-snippet" style="display: none;"></div>
        </div>

        <div class="options-grid" id="options-grid"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="explanation-title">💡 Logic Explanation</div>
            <div class="explanation-text" id="explanation-text"></div>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <div class="results-card" id="results-screen">
        <h2>🎉 Assessment Complete!</h2>
        <p>Here is your performance on the STEMpedia AI Home Automation project:</p>
        <div class="score-circle">
            <div class="score-num" id="final-score">0/10</div>
            <div style="font-size: 12px; color: #a855f7; font-weight: 800;">TOTAL SCORE</div>
        </div>
        <p id="feedback-msg" style="font-size: 18px; font-weight: 700; margin-bottom: 20px;"></p>
        <button class="restart-btn" onclick="restartQuiz()">Retake Quiz 🔄</button>
    </div>
</div>

<script>
    let audioCtx = null;
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(174.61, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        } catch(e) {}
    }

    const questions = [
        {
            q: "Which sprite acts as the virtual AI assistant in STEMpedia's AI Home Automation project to receive voice commands?",
            code: null,
            options: [
                { text: "Abby", correct: true, exp: "Abby is selected as the main assistant sprite that listens to voice input and triggers home appliances." },
                { text: "Tobi", correct: false, exp: "Tobi is the default bear sprite in PictoBlox, not used as the assistant here." },
                { text: "John", correct: false, exp: "John is used in driver/card recognition tutorials." },
                { text: "Dev", correct: false, exp: "Dev is a different standard PictoBlox character." }
            ]
        },
        {
            q: "Which specific PictoBlox block is used by Abby to capture the user's voice input for a duration of 5 seconds?",
            code: null,
            options: [
                { text: "recognize speech for (5) sec in (English)", correct: true, exp: "This block opens the microphone for 5 seconds to convert voice into text." },
                { text: "ask [What is your command?] and wait", correct: false, exp: "This opens a text input box, not voice recognition." },
                { text: "listen to sound for (5) secs", correct: false, exp: "This is not a valid PictoBlox block." },
                { text: "speak [recognize voice] for (5) secs", correct: false, exp: "The speak block is from Text-to-Speech and outputs audio instead of listening." }
            ]
        },
        {
            q: "In Abby's script, how does the program verify if the user commanded the room lights to turn on?",
            code: "if <(speech recognition result) contains [Lights on]?> then\n    speak [Switching on the Lights]\n    broadcast [Lights ON]\nend",
            options: [
                { text: "By checking if (speech recognition result) contains 'Lights on'", correct: true, exp: "The 'contains' block checks if the spoken words match the keyword string." },
                { text: "By measuring if <loudness > 50>", correct: false, exp: "Loudness checks sound volume, not command content." },
                { text: "By checking if <key [space v] pressed?>", correct: false, exp: "Key press checks keyboard input." },
                { text: "By checking if <touching [Lamp v]?>", correct: false, exp: "Touching checks sprite collision." }
            ]
        },
        {
            q: "How does Abby communicate back to the user after recognizing a command in this project?",
            code: null,
            options: [
                { text: "Using 'speak ()' from Text to Speech and 'say ()' from Looks", correct: true, exp: "The project uses both 'speak' (audio synthesis) and 'say' (speech bubble) so Abby talks and shows text." },
                { text: "By playing guitar notes using the Music extension", correct: false, exp: "Music extension is not used for voice responses." },
                { text: "By changing the backdrop color directly", correct: false, exp: "Abby speaks verbally rather than just changing backgrounds." },
                { text: "By printing output to the terminal only", correct: false, exp: "Scratch block-based projects use stage visual/audio outputs." }
            ]
        },
        {
            q: "How does Abby's script signal the Lamp sprite to turn ON without directly modifying the Lamp's code inside her own block?",
            code: null,
            options: [
                { text: "By sending a 'broadcast [Lights ON]' message", correct: true, exp: "Broadcast blocks allow Abby to send event signals across different sprites." },
                { text: "By changing a physical pin output on Arduino", correct: false, exp: "This project is animated on stage using broadcasts rather than microcontroller pin programming." },
                { text: "By moving Abby to x: 0 y: 0", correct: false, exp: "Positioning does not trigger sprite actions." },
                { text: "By setting variable [Lights] to 100", correct: false, exp: "The STEMpedia script specifically uses broadcast messages." }
            ]
        },
        {
            q: "When the Lamp sprite receives the broadcast 'Lights ON', how does it visually look like it turned on?",
            code: "when I receive [Lights ON v]\nswitch costume to [lamp-light-animation2 v]",
            options: [
                { text: "It switches its costume to 'lamp-light-animation2'", correct: true, exp: "Changing the costume to the glowing lamp costume provides the visual 'ON' state." },
                { text: "It glides across the bedroom stage", correct: false, exp: "The lamp remains stationary in the bedroom." },
                { text: "It increases its size by 200%", correct: false, exp: "Size stays constant." },
                { text: "It spins 360 degrees", correct: false, exp: "Rotation is not used for the lamp." }
            ]
        },
        {
            q: "How is the Fan sprite animated to simulate continuous spinning when it receives 'Fan ON'?",
            code: "when I receive [Fan ON v]\nrepeat until <(speech recognition result) contains [fan off]>\n    next costume\n    wait (0.001) seconds\nend",
            options: [
                { text: "Using a 'repeat until' loop cycling 'next costume' until 'fan off' is recognized", correct: true, exp: "Cycling through fan costumes inside a repeat until loop creates the spinning animation." },
                { text: "Using a 'turn clockwise 15 degrees' block inside a forever loop", correct: false, exp: "The STEMpedia script rotates fan costumes rather than degree turns." },
                { text: "By moving the fan left and right across the stage", correct: false, exp: "The fan stays mounted in position." },
                { text: "By changing the fan color effect continuously", correct: false, exp: "Color effects are not used for spinning." }
            ]
        },
        {
            q: "In the STEMpedia tutorial, what action occurs when Abby recognizes the voice command 'play song' or 'radio on'?",
            code: "when I receive [Radio ON v]\nplay sound [Spiderman v] until done",
            options: [
                { text: "The Radio sprite plays the Spider-Man theme sound track", correct: true, exp: "The Radio script triggers the loaded audio track when receiving the Radio ON broadcast." },
                { text: "The Radio sprite hides from the stage", correct: false, exp: "The radio remains visible." },
                { text: "The camera feed turns on", correct: false, exp: "Camera is not used in this specific project." },
                { text: "The text-to-speech reads out news headlines", correct: false, exp: "The radio specifically plays the project's sound clip." }
            ]
        },
        {
            q: "How does the room backdrop react when the command 'Lights OFF' is triggered?",
            code: "when I receive [Lights OFF v]\nset brightness effect to (-50)",
            options: [
                { text: "The Stage sets its brightness effect to a negative value (-50) to darken the room", correct: true, exp: "Decreasing stage brightness simulates turning off ambient room lights." },
                { text: "The Stage switches to a completely black costume", correct: false, exp: "It uses graphic brightness effects rather than costume changes." },
                { text: "The Stage deletes all sprites", correct: false, exp: "Sprites remain on stage." },
                { text: "The Stage stops all running scripts", correct: false, exp: "The main loop continues running so it can listen for further commands." }
            ]
        },
        {
            q: "Which two PictoBlox Extensions are strictly required to build this stage-based Home Automation project?",
            code: null,
            options: [
                { text: "Speech Recognition and Text to Speech", correct: true, exp: "Speech Recognition listens to user voice commands, and Text to Speech lets Abby talk back." },
                { text: "Face Detection and Micro:bit", correct: false, exp: "Face detection is not used in this project." },
                { text: "Arduino Actuators and Dabble", correct: false, exp: "This tutorial is purely soft-simulated on stage without hardware board extensions." },
                { text: "Machine Learning and Pen Extension", correct: false, exp: "Neither ML model training nor Pen drawing is required for this voice project." }
            ]
        }
    ];

    let currentQ = 0, quizScore = 0, quizTimer, quizTimeLeft = 25, answered = false;

    function loadQuestion() {
        answered = false;
        clearInterval(quizTimer);
        quizTimeLeft = 25;
        updateTimerUI();
        
        const q = questions[currentQ];
        document.getElementById('question-number').innerText = `Q${currentQ + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-fill').style.width = `${((currentQ + 1) / questions.length) * 100}%`;
        
        const codeBox = document.getElementById('code-snippet');
        if (q.code) { codeBox.innerText = q.code; codeBox.style.display = 'block'; } 
        else { codeBox.style.display = 'none'; }

        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}) ${opt.text}</span>`;
            btn.onclick = () => selectOption(idx);
            grid.appendChild(btn);
        });

        quizTimer = setInterval(() => {
            quizTimeLeft--;
            updateTimerUI();
            if (quizTimeLeft <= 0) { clearInterval(quizTimer); autoTimeOut(); }
        }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('timer-text').innerText = quizTimeLeft;
        const pct = (quizTimeLeft / 25) * 100;
        document.getElementById('timer-circle').style.background = `conic-gradient(#f43f5e ${pct}%, #581c87 0%)`;
    }

    function selectOption(idx) {
        if (answered) return;
        answered = true;
        clearInterval(quizTimer);

        const q = questions[currentQ];
        const selected = q.options[idx];
        const btns = document.querySelectorAll('.option-btn');

        btns.forEach((btn, i) => {
            btn.disabled = true;
            if (q.options[i].correct) btn.classList.add('correct');
        });

        if (selected.correct) {
            btns[idx].classList.add('correct');
            quizScore++;
            document.getElementById('current-score').innerText = quizScore * 10;
            playSound('correct');
        } else {
            btns[idx].classList.add('wrong');
            playSound('wrong');
        }

        document.getElementById('explanation-text').innerText = selected.exp;
        document.getElementById('explanation-box').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function autoTimeOut() {
        if (answered) return;
        answered = true;
        const q = questions[currentQ];
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((btn, i) => {
            btn.disabled = true;
            if (q.options[i].correct) btn.classList.add('correct');
        });
        playSound('wrong');
        document.getElementById('explanation-text').innerText = "Time expired! Review the STEMpedia script logic.";
        document.getElementById('explanation-box').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) loadQuestion();
        else showResults();
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${quizScore}/${questions.length}`;
        const msg = document.getElementById('feedback-msg');
        msg.innerText = quizScore >= 7 ? "Great job! Perfect understanding of STEMpedia's PictoBlox logic." : "Review Abby's broadcast blocks and try again!";
    }

    function restartQuiz() {
        currentQ = 0; quizScore = 0;
        document.getElementById('current-score').innerText = 0;
        document.getElementById('results-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    loadQuestion();
</script>
</body>
</html>
